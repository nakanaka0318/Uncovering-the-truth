/* ===== 肖像：手続き生成のシルエット肖像（SVG） ===== */

const Portrait = (() => {
  const ACCENTS = ['#7a2433', '#3f5a4a', '#3d4a66', '#8a6a2e', '#5b3a5e', '#6b3b2a', '#4a4f57', '#2f4f5a'];
  const BGS = ['#3a2a22', '#2a2a36', '#33262c', '#26302c', '#382e22', '#2c2433'];
  const cache = {};

  function make(seed) {
    if (cache[seed]) return cache[seed];
    const r = new RNG('portrait' + seed);
    const id = 'p' + (hashStr(String(seed)) % 1e8);
    const acc = r.pick(ACCENTS);
    const bg = r.pick(BGS);
    const hrx = 13 + r.int(4), hry = 17 + r.int(4);
    const hy = 60 + r.int(4);
    const hair = r.pick(['short', 'long', 'bun', 'bald', 'curly', 'none']);
    const hat = r.pick(['none', 'none', 'hood', 'tophat', 'brim', 'tricorn', 'veil', 'cap', 'bonnet', 'mitre', 'none']);
    const beard = r.chance(0.28) ? r.pick(['full', 'goatee', 'mustache']) : null;
    const glasses = r.chance(0.12);
    const shoulderW = 34 + r.int(8);
    const eyeY = hy + 1;
    const eyeDx = 5 + r.int(2);
    const top = hy - hry;

    const parts = [];
    const figure = `fill="url(#${id}f)" stroke="url(#${id}r)" stroke-width="1.4"`;
    // 背景
    parts.push(`<rect width="100" height="130" fill="url(#${id}b)"/>`);
    // 長髪（体の後ろ）
    if (hair === 'long' && hat !== 'hood' && hat !== 'veil') {
      parts.push(`<path d="M${50 - hrx - 3},${hy - 4} C${50 - hrx - 6},${hy + 30} ${50 - hrx - 4},${hy + 40} ${50 - hrx + 2},${hy + 44} L${50 + hrx - 2},${hy + 44} C${50 + hrx + 4},${hy + 40} ${50 + hrx + 6},${hy + 30} ${50 + hrx + 3},${hy - 4} Z" ${figure}/>`);
    }
    if (hat === 'hood' || hat === 'veil') {
      const w = hrx + 9;
      parts.push(`<path d="M${50 - w},${hy + 34} C${50 - w - 2},${top - 2} ${50 - 8},${top - 10} 50,${top - 10} C${50 + 8},${top - 10} ${50 + w + 2},${top - 2} ${50 + w},${hy + 34} Z" ${figure}/>`);
    }
    // 肩
    parts.push(`<path d="M${50 - shoulderW - 10},130 C${50 - shoulderW - 8},${hy + 40} ${50 - 16},${hy + 30} 50,${hy + 30} C${50 + 16},${hy + 30} ${50 + shoulderW + 8},${hy + 40} ${50 + shoulderW + 10},130 Z" ${figure}/>`);
    // 襟
    parts.push(`<path d="M${50 - 13},${hy + 31} L50,${hy + 50} L${50 + 13},${hy + 31} L${50 + 8},${hy + 29} L50,${hy + 40} L${50 - 8},${hy + 29} Z" fill="${acc}" opacity="0.85"/>`);
    // 首
    parts.push(`<rect x="44" y="${hy + 12}" width="12" height="${20}" rx="4" fill="url(#${id}f)"/>`);
    // 頭
    parts.push(`<ellipse cx="50" cy="${hy}" rx="${hrx}" ry="${hry}" ${figure}/>`);
    // 髪
    if (hat === 'none' || hat === 'brim' || hat === 'tophat' || hat === 'tricorn' || hat === 'cap') {
      if (hair === 'short') parts.push(`<path d="M${50 - hrx - 1},${hy - 2} C${50 - hrx},${top - 4} ${50 + hrx},${top - 4} ${50 + hrx + 1},${hy - 2} C${50 + hrx - 4},${top + 6} ${50 - hrx + 4},${top + 6} ${50 - hrx - 1},${hy - 2} Z" ${figure}/>`);
      if (hair === 'bun') parts.push(`<circle cx="50" cy="${top - 3}" r="7" ${figure}/>`);
      if (hair === 'curly') for (let x = -2; x <= 2; x++) parts.push(`<circle cx="${50 + x * (hrx / 2.4)}" cy="${top + 2 + Math.abs(x) * 3}" r="5.5" ${figure}/>`);
    }
    // 帽子
    if (hat === 'tophat') parts.push(`<path d="M${50 - hrx - 7},${top + 6} L${50 + hrx + 7},${top + 6} L${50 + hrx + 7},${top + 9} L${50 - hrx - 7},${top + 9} Z M${50 - hrx + 2},${top + 6} L${50 - hrx + 3},${top - 22} L${50 + hrx - 3},${top - 22} L${50 + hrx - 2},${top + 6} Z" ${figure}/><rect x="${50 - hrx + 2.5}" y="${top + 1}" width="${2 * hrx - 5}" height="3" fill="${acc}"/>`);
    if (hat === 'brim') parts.push(`<ellipse cx="50" cy="${top + 7}" rx="${hrx + 14}" ry="4.5" ${figure}/><path d="M${50 - hrx + 1},${top + 6} C${50 - hrx + 2},${top - 12} ${50 + hrx - 2},${top - 12} ${50 + hrx - 1},${top + 6} Z" ${figure}/>`);
    if (hat === 'tricorn') parts.push(`<path d="M${50 - hrx - 10},${top + 8} Q50,${top - 18} ${50 + hrx + 10},${top + 8} Q50,${top + 2} ${50 - hrx - 10},${top + 8} Z" ${figure}/>`);
    if (hat === 'cap') parts.push(`<path d="M${50 - hrx - 1},${top + 9} C${50 - hrx},${top - 6} ${50 + hrx},${top - 6} ${50 + hrx + 1},${top + 9} Z" ${figure}/><path d="M${50 + hrx - 4},${top + 8} L${50 + hrx + 9},${top + 10} L${50 + hrx - 2},${top + 11} Z" ${figure}/>`);
    if (hat === 'bonnet') parts.push(`<path d="M${50 - hrx - 4},${hy + 6} C${50 - hrx - 6},${top - 8} ${50 + hrx + 6},${top - 8} ${50 + hrx + 4},${hy + 6} C${50 + hrx},${top + 4} ${50 - hrx},${top + 4} ${50 - hrx - 4},${hy + 6} Z" ${figure}/>`);
    if (hat === 'mitre') parts.push(`<path d="M${50 - hrx + 1},${top + 7} L${50 - hrx + 3},${top - 14} L50,${top - 24} L${50 + hrx - 3},${top - 14} L${50 + hrx - 1},${top + 7} Z" ${figure}/><path d="M50,${top - 22} L50,${top + 6} M${50 - 5},${top - 6} L${50 + 5},${top - 6}" stroke="${acc}" stroke-width="2"/>`);
    if (hat === 'veil') parts.push(`<path d="M${50 - hrx - 2},${top + 6} C${50 - hrx},${top} ${50 + hrx},${top} ${50 + hrx + 2},${top + 6}" stroke="${acc}" stroke-width="3" fill="none"/>`);
    // 髭
    if (beard === 'full') parts.push(`<path d="M${50 - hrx + 2},${hy + 4} C${50 - hrx + 3},${hy + hry + 8} ${50 + hrx - 3},${hy + hry + 8} ${50 + hrx - 2},${hy + 4} C${50 + 6},${hy + 12} ${50 - 6},${hy + 12} ${50 - hrx + 2},${hy + 4} Z" ${figure}/>`);
    if (beard === 'goatee') parts.push(`<path d="M46,${hy + hry - 5} L50,${hy + hry + 7} L54,${hy + hry - 5} Z" ${figure}/>`);
    if (beard === 'mustache') parts.push(`<path d="M42,${hy + 9} Q50,${hy + 5} 58,${hy + 9} Q50,${hy + 8} 42,${hy + 9} Z" fill="#0b0809"/>`);
    // 目（灯りを映す点）
    const glow = `fill="#e9c98a" opacity="${0.55 + r.next() * 0.3}"`;
    parts.push(`<ellipse cx="${50 - eyeDx}" cy="${eyeY}" rx="1.7" ry="1.1" ${glow}/><ellipse cx="${50 + eyeDx}" cy="${eyeY}" rx="1.7" ry="1.1" ${glow}/>`);
    if (glasses) parts.push(`<circle cx="${50 - eyeDx}" cy="${eyeY}" r="3.4" fill="none" stroke="#c8a25a" stroke-width="0.8" opacity="0.7"/><circle cx="${50 + eyeDx}" cy="${eyeY}" r="3.4" fill="none" stroke="#c8a25a" stroke-width="0.8" opacity="0.7"/>`);

    const lightX = r.chance(0.5) ? 0 : 1;
    const svg = `<svg class="portrait-svg" viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs>
<radialGradient id="${id}b" cx="${lightX ? 70 : 30}%" cy="30%" r="85%"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="#0c090b"/></radialGradient>
<linearGradient id="${id}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#231b20"/><stop offset="1" stop-color="#0e0b0d"/></linearGradient>
<linearGradient id="${id}r" x1="${lightX}" y1="0" x2="${1 - lightX}" y2="0.4"><stop offset="0" stop-color="#d9b46a" stop-opacity="0.75"/><stop offset="0.45" stop-color="#d9b46a" stop-opacity="0"/></linearGradient>
</defs>${parts.join('')}</svg>`;
    cache[seed] = svg;
    return svg;
  }
  return { make };
})();

/* ---- game.js ---- */
/* ===== ゲーム進行：ラン・審判・報酬・保存 ===== */

const RUN_KEY = 'itsuwari-no-tei/run/v1';
const META_KEY = 'itsuwari-no-tei/meta/v1';

const Game = (() => {
  let meta = null;
  let run = null;
  const listeners = [];

  function defaultMeta() {
    return {
      trialsCleared: 0, runs: 0, wins: 0, maxRank: 0, bestChapter: -1,
      evilCaught: 0, misExec: 0, tutorialDone: false,
      flags: {}, newUnlocks: [],
      settings: { bgm: true, sfx: true, speed: 1 },
    };
  }
  function loadMeta() {
    meta = Object.assign(defaultMeta(), store.get(META_KEY, {}));
    meta.settings = Object.assign(defaultMeta().settings, meta.settings || {});
    meta.flags = meta.flags || {};
    return meta;
  }
  const saveMeta = () => store.set(META_KEY, meta);
  const saveRun = () => { if (run && run.tutorial) return; if (run) store.set(RUN_KEY, run); else store.del(RUN_KEY); };
  function loadRun() {
    const r = store.get(RUN_KEY, null);
    run = r && r.v === 1 ? r : null;
    return run;
  }
  const emit = (ev, data) => listeners.forEach((f) => f(ev, data));

  /* ----- 解禁 ----- */
  const roleUnlocked = (r) => (r.unlock || 0) <= meta.trialsCleared || (r.complex && !!meta.flags.abyss) || (r.extraOnly && !!meta.flags.abyss);
  function relicUnlocked(rl) {
    const u = rl.unlock;
    if (u === 'base') return true;
    if (u[0] === 't') return meta.trialsCleared >= +u.slice(1);
    return !!meta.flags[u];
  }
  function pools(extra) {
    const un = extra ? ROLES.filter((r) => !r.finalOnly && !r.extraOnly) : ROLES.filter(roleUnlocked);
    return {
      good: un.filter((r) => r.align === 'good').map((r) => r.id),
      med: un.filter((r) => r.align === 'med').map((r) => r.id),
      minion: un.filter((r) => r.align === 'minion').map((r) => r.id),
    };
  }
  function checkUnlocks(before) {
    const now = [];
    ROLES.forEach((r) => { if (r.unlock && r.unlock > before.t && r.unlock <= meta.trialsCleared) now.push({ kind: 'role', id: r.id }); });
    RELICS.forEach((rl) => { if (!before.relics.has(rl.id) && relicUnlocked(rl)) now.push({ kind: 'relic', id: rl.id }); });
    return now;
  }
  const unlockSnapshot = () => ({ t: meta.trialsCleared, relics: new Set(RELICS.filter(relicUnlocked).map((r) => r.id)) });

  /* ----- ラン ----- */
  function newRun(rank) {
    const seed = Math.floor(Math.random() * 1e9);
    const maxCred = BASE_CRED - (rank >= 1 ? 1 : 0);
    run = {
      v: 1, seed, rank, chapter: 0, trialIdx: 0,
      cred: maxCred, maxCred, silver: 10,
      relics: [], items: ['holywater'], slots: 3,
      phase: 'trial', trial: null, reward: null, shop: null, step: 0,
      stats: { trials: 0, evil: 0, mis: 0, flips: 0 },
      log: [],
    };
    meta.runs++;
    saveMeta();
    startTrial();
    return run;
  }
  const has = (id) => run && run.relics.includes(id);
  const rng = (tag) => new RNG(run.seed + ':' + tag + ':' + run.step);

  function trialSpec() {
    const ch = CHAPTERS[run.chapter];
    const base = ch.trials[run.trialIdx];
    const r = rng('spec');
    let boss = null;
    if (base.boss) {
      if (ch.boss === 'any') {
        const cands = ['wolfking', 'bishop', 'masked'].filter((b) => roleUnlocked(ROLE[b]));
        boss = r.pick(cands);
      } else if (ch.boss === 'masked' && !roleUnlocked(ROLE.masked) && !ch.extra) boss = 'wolfking';
      else boss = ch.boss;
    }
    let k = base.k, m = base.m;
    const n = base.R * base.C;
    if (run.rank >= 2 && run.chapter >= 1) m += 1;
    if (run.rank >= 4 && run.chapter >= 2) k = Math.min(k + 1, Math.floor(n / 3) + 1);
    const afflictCount = { wolfking: 1, bishop: 2, lord: 2, hollow: 2, thousand: 1 }[boss] || 0;
    let maxAmb = 1;
    if (run.chapter >= 1) maxAmb = r.chance(0.3) ? 2 : 1;
    if (ch.final) maxAmb = r.chance(0.5) ? 2 : 1;
    if (ch.extra) maxAmb = r.chance(0.35) ? 2 : 1;
    return { R: base.R, C: base.C, k, m, boss, afflictCount, maxAmb, chapter: run.chapter, lurk: base.lurk || 0, complex: !!base.complex, extra: !!ch.extra };
  }

  function startTrial() {
    const spec = trialSpec();
    if (spec.extra && !meta.flags.abyss) { meta.flags.abyss = true; saveMeta(); }
    const res = generateTrial(spec, pools(spec.extra), run.seed + ':trial:' + run.step);
    const r = rng('names');
    const names = r.sample(NAMES, spec.R * spec.C);
    const cards = res.w.cards.map((c, x) => ({
      i: c.i, name: names[x], face: run.seed + '-' + run.step + '-' + x,
      role: c.role, claim: c.claim, align: c.align, afflict: c.afflict,
      policy: c.policy, want: c.want, stmt: c.stmt,
      flipped: false, executed: false, mark: '',
      seal: null, holy: null, truthShown: false, identity: null, afflictShown: false, crow: null,
      tenbin: false,
    }));
    const t = {
      R: spec.R, C: spec.C, n: spec.R * spec.C, k: spec.k, u: res.w.u, m: spec.m, lurk: res.w.lurk || 0,
      misPlus: CHAPTERS[run.chapter].misPlus || 0,
      boss: spec.boss, chapter: run.chapter, idx: run.trialIdx, amb: res.amb,
      cards, order: [], evilDown: 0, mis: 0, done: false, failed: false,
      pardon: false, hotenUsed: false, bossRow: null, events: [],
    };
    run.trial = t;
    run.phase = 'trial';
    const r2 = rng('relicstart');
    if (has('tenbin')) r2.pick(cards).tenbin = true;
    if (has('gantai')) { const c = r2.pick(cards.filter((x) => x.align === 'good' && !x.afflict)); if (c) c.seal = 'white'; }
    if (has('shokan')) { const c = r2.pick(cards.filter((x) => x.align === 'med' || x.afflict)); if (c) c.seal = 'unr'; }
    if (has('kiba') && spec.boss) { const b = cards.find((x) => x.role === spec.boss); t.bossRow = Math.floor(b.i / spec.C); }
    if (has('seihai') && r2.chance(0.33)) addItem('holywater');
    saveRun();
  }

  /* ----- 審判中の行動 ----- */
  function flip(i) {
    const t = run.trial;
    const c = t.cards[i];
    if (c.flipped || t.done) return null;
    c.flipped = true;
    t.order.push(i);
    run.stats.flips++;
    if (!c.stmt) c.stmt = lazyStatement(t, i, rng('lazy' + i + ':' + t.order.length));
    if (c.tenbin) c.truthShown = true;
    if (has('kanenoshita') && t.order.length === 1) c.truthShown = true;
    if (has('hakkotsu') && c.afflict) c.afflictShown = true;
    saveRun();
    return c;
  }

  function setMark(i, m) {
    const c = run.trial.cards[i];
    c.mark = c.mark === m ? '' : m;
    saveRun();
  }

  function agitatorAlive(t) {
    return t.cards.some((c) => c.role === 'agitator' && !c.executed);
  }

  function execute(i) {
    const t = run.trial;
    const c = t.cards[i];
    if (c.executed || t.done) return null;
    c.executed = true;
    const out = { card: c, evil: c.align === 'evil', penalty: 0, saved: null, silver: 0 };
    if (has('karasu')) {
      const g = geo(t.R, t.C);
      out.crow = g.adj8[i].filter((j) => t.cards[j].align === 'evil').length;
      c.crow = out.crow;
    }
    if (out.evil) {
      t.evilDown++;
      run.stats.evil++;
      meta.evilCaught++;
      if (has('yubiwa')) { run.silver += 4; out.silver += 4; }
      if (t.evilDown >= t.k) winTrial(out);
    } else {
      let p = c.align === 'med' ? (ROLE[c.role].execCost || 1) : 2;
      if (agitatorAlive(t)) p += 1;
      if (run.rank >= 5) p += 1;
      p += t.misPlus || 0;
      if (has('hoten') && !t.hotenUsed) { p = Math.max(0, p - 1); t.hotenUsed = true; }
      if (t.pardon) { p = 0; t.pardon = false; out.saved = 'pardon'; }
      else if (has('kuroneko') && rng('neko' + t.mis + ':' + i).chance(0.5)) { p = 0; out.saved = 'kuroneko'; }
      out.penalty = p;
      run.cred -= p;
      t.mis++;
      run.stats.mis++;
      meta.misExec++;
      if (run.cred <= 0) {
        run.cred = 0;
        t.failed = true;
        loseRun();
        out.gameover = true;
      }
    }
    saveRun(); saveMeta();
    return out;
  }

  function winTrial(out) {
    const t = run.trial;
    t.done = true;
    const before = unlockSnapshot();
    const gain = 12 + t.k * 3 + (t.mis === 0 ? 10 : 0);
    run.silver += gain;
    out.win = { silver: gain, perfect: t.mis === 0, healed: 0 };
    if (t.mis === 0 && has('kitosho') && run.cred < run.maxCred) { run.cred++; out.win.healed = 1; }
    run.stats.trials++;
    meta.trialsCleared++;
    const ch = CHAPTERS[run.chapter];
    const lastOfChapter = run.trialIdx === ch.trials.length - 1;
    if (lastOfChapter) {
      if (run.chapter === 0) meta.flags.ch1 = true;
      if (run.chapter === 1) meta.flags.ch2 = true;
      if (run.chapter === 2) meta.flags.ch3 = true;
      if (ch.final) meta.flags.win = true;
      if (ch.extra && !ch.finalExtra) meta.flags.abyss1 = true;
      if (ch.finalExtra) meta.flags.abyss2 = true;
      meta.bestChapter = Math.max(meta.bestChapter, run.chapter);
    }
    out.unlocks = checkUnlocks(before);
    meta.newUnlocks = (meta.newUnlocks || []).concat(out.unlocks);
    if (ch.final && lastOfChapter && !run.extended) {
      meta.wins++;
      meta.maxRank = Math.max(meta.maxRank, Math.min(RANKS.length - 1, run.rank + 1));
      run.phase = 'victory';
    } else if (ch.finalExtra && lastOfChapter) {
      run.phase = 'victory2';
    } else {
      run.phase = 'reward';
      run.reward = makeReward(!!ch.trials[run.trialIdx].boss);
    }
  }

  function loseRun() {
    run.phase = 'gameover';
    meta.bestChapter = Math.max(meta.bestChapter, run.chapter - 1);
  }

  /* ----- 道具 ----- */
  function addItem(id) {
    if (run.items.length >= slotCount()) return false;
    run.items.push(id);
    return true;
  }
  const slotCount = () => run.slots + (has('gaito') ? 1 : 0);

  function useItem(slot, target) {
    const t = run.trial;
    const id = run.items[slot];
    if (!id || t.done) return null;
    const it = ITEM[id];
    const res = { id };
    if (it.target !== 'none') {
      const c = t.cards[target];
      if (!c) return null;
      if (it.target === 'flipped' && !c.flipped) return { error: '尋問済みの者にしか使えない。' };
      res.card = c;
      if (id === 'holywater') {
        const fakesGood = ['spy', 'masked', 'lord', 'hollow', 'thousand'].includes(c.role);
        c.holy = c.align === 'evil' && !fakesGood ? 'evil' : 'good';
        res.result = c.holy;
      } else if (id === 'scales') {
        c.truthShown = true;
        res.result = statementTruth(t, c.i);
      } else if (id === 'candle') {
        const fooled = c.role === 'masked' || c.role === 'hollow';
        c.identity = fooled ? c.claim : c.role;
        if (c.afflict) c.afflictShown = true;
        res.result = c.identity;
      }
    } else {
      if (id === 'pardon') { if (t.pardon) return { error: '赦免状はすでに効いている。' }; t.pardon = true; }
      if (id === 'wine') { if (run.cred >= run.maxCred) return { error: '信用はすでに満ちている。' }; run.cred = Math.min(run.maxCred, run.cred + 2); }
      if (id === 'lily') {
        const c = rng('lily' + t.order.length + ':' + run.items.length).pick(t.cards.filter((x) => x.align === 'good' && !x.afflict && x.seal !== 'white' && !x.executed));
        if (!c) return { error: '示すべき無辜はもういない。' };
        c.seal = 'white';
        res.card = c;
      }
    }
    run.items.splice(slot, 1);
    saveRun();
    return res;
  }

  /* ----- 報酬・行商・幕間 ----- */
  function relicPool() {
    return RELICS.filter((rl) => relicUnlocked(rl) && !run.relics.includes(rl.id)).map((r) => r.id);
  }
  function makeReward(boss) {
    const r = rng('reward');
    let count = 3 + (has('sakazuki') ? 1 : 0) - (run.rank >= 3 ? 1 : 0);
    const opts = [];
    if (boss) {
      r.sample(relicPool(), count).forEach((id) => opts.push({ type: 'relic', id }));
    } else {
      const bag = [];
      const rp = relicPool();
      if (rp.length && r.chance(0.55)) bag.push({ type: 'relic', id: r.pick(rp) });
      const its = r.sample(ITEMS.map((x) => x.id), 2);
      its.forEach((id) => bag.push({ type: 'item', id }));
      bag.push({ type: 'rest', amount: 2 });
      bag.push({ type: 'silver', amount: 22 });
      r.shuffle(bag).slice(0, count).forEach((o) => opts.push(o));
    }
    if (!opts.length) opts.push({ type: 'silver', amount: 30 });
    return { options: opts, taken: false };
  }

  function takeReward(idx) {
    const o = run.reward.options[idx];
    if (!o || run.reward.taken) return null;
    const res = applyGain(o);
    if (res && res.error) return res;
    run.reward.taken = true;
    advance();
    return res;
  }
  function skipReward() { run.reward.taken = true; advance(); }

  function applyGain(o) {
    if (o.type === 'relic') {
      run.relics.push(o.id);
      if (o.id === 'seiyaku') { run.maxCred += 2; run.cred += 2; }
    } else if (o.type === 'item') {
      if (!addItem(o.id)) return { error: '道具がいっぱいだ。' };
    } else if (o.type === 'rest') {
      run.cred = Math.min(run.maxCred, run.cred + o.amount);
    } else if (o.type === 'silver') {
      run.silver += o.amount;
    }
    saveRun();
    return { ok: true };
  }

  function advance() {
    const ch = CHAPTERS[run.chapter];
    run.step++;
    if (run.trialIdx < ch.trials.length - 1) {
      run.trialIdx++;
      startTrial();
    } else {
      run.phase = 'interlude';
      run.shop = makeShop();
    }
    saveRun();
  }

  const price = (p) => Math.round(p * (has('kagi') ? 0.7 : 1));
  function makeShop() {
    const r = rng('shop');
    const goods = r.sample(ITEMS.map((x) => x.id), 3).map((id) => ({ type: 'item', id, price: price(ITEM[id].price), sold: false }));
    const rp = relicPool();
    if (rp.length) goods.push({ type: 'relic', id: r.pick(rp), price: price(48), sold: false });
    goods.push({ type: 'rest', amount: 2, price: price(20), sold: false });
    return { goods, rested: false };
  }
  function buy(idx) {
    const g = run.shop.goods[idx];
    if (!g || g.sold) return null;
    if (run.silver < g.price) return { error: '銀貨が足りない。' };
    if (g.type === 'rest' && run.cred >= run.maxCred) return { error: '信用はすでに満ちている。' };
    const res = applyGain(g);
    if (res.error) return res;
    run.silver -= g.price;
    g.sold = true;
    saveRun();
    return { ok: true };
  }
  function rest() {
    if (run.shop.rested) return null;
    const amt = run.rank >= 5 ? 1 : 2;
    run.cred = Math.min(run.maxCred, run.cred + amt);
    run.shop.rested = true;
    saveRun();
    return { amount: amt };
  }
  function nextChapter() {
    run.chapter++;
    run.trialIdx = 0;
    run.step++;
    run.shop = null;
    startTrial();
    saveRun();
  }

  function abandon() { run = null; saveRun(); }

  /* ----- 外典（勝利後の続き） ----- */
  const firstExtra = () => CHAPTERS.findIndex((c) => c.extra);
  function continueExtra() {
    run.extended = true;
    run.chapter = firstExtra();
    run.trialIdx = 0;
    run.step++;
    run.cred = Math.min(run.maxCred, run.cred + 2);
    meta.flags.abyss = true;
    saveMeta();
    startTrial();
    saveRun();
  }
  function newExtraRun(rank) {
    newRun(rank);
    const r = new RNG(run.seed + ':extra-start');
    run.relics = r.sample(RELICS.filter((x) => relicUnlocked(x) && x.id !== 'seiyaku').map((x) => x.id), 2);
    run.items = ['holywater', 'scales'];
    run.silver = 40;
    run.extended = true;
    run.direct = true;
    run.chapter = firstExtra();
    run.step++;
    meta.flags.abyss = true;
    saveMeta();
    startTrial();
    saveRun();
  }

  /* ----- 手ほどき（固定盤面） ----- */
  function tutorialTrial() {
    const def = [
      { role: 'watch', align: 'good', stmt: { text: '私の上下左右に、虚偽者は0人いる。', pred: { t: 'cnt', s: [1, 3], v: 0 }, refs: [1, 3] } },
      { role: 'seer', align: 'good', stmt: { text: '⟦5⟧は虚偽者ではない。', pred: { t: 'ev', j: 5, b: false }, refs: [5] } },
      { role: 'perjurer', claim: 'accuser', align: 'evil', stmt: { text: '⟦0⟧は虚偽者だ！', pred: { t: 'ev', j: 0, b: true }, refs: [0] } },
      { role: 'nun', align: 'good', stmt: { text: '⟦1⟧は善良な者だ。私が保証しよう。', pred: { t: 'ev', j: 1, b: false }, refs: [1] } },
      { role: 'gate', align: 'good', stmt: { text: '私の上下左右に、虚偽者はいない。', pred: { t: 'any', s: [1, 3, 5], b: false }, refs: [1, 3, 5] } },
      { role: 'locksmith', align: 'good', stmt: { text: '⟦0⟧・⟦2⟧・⟦4⟧の中に、虚偽者は1人いる。', pred: { t: 'cnt', s: [0, 2, 4], v: 1 }, refs: [0, 2, 4] } },
    ];
    const names = ['エルマ', 'ヨハン', 'ギーゼラ', 'マティアス', 'リーゼル', 'オスヴァルト'];
    return {
      R: 2, C: 3, n: 6, k: 1, u: 0, m: 0, boss: null, chapter: -1, idx: 0, amb: 1, tutorial: true,
      cards: def.map((d, i) => ({
        i, name: names[i], face: 'tut-' + i, role: d.role, claim: d.claim || d.role, align: d.align, afflict: null,
        policy: d.align === 'evil' ? 'F' : 'T', want: d.align !== 'evil', stmt: d.stmt,
        flipped: false, executed: false, mark: '', seal: null, holy: null, truthShown: false, identity: null,
        afflictShown: false, crow: null, tenbin: false,
      })),
      order: [], evilDown: 0, mis: 0, done: false, failed: false, pardon: false, hotenUsed: false, bossRow: null, events: [],
    };
  }
  function startTutorial() {
    run = {
      v: 1, seed: 1, rank: 0, chapter: 0, trialIdx: 0, cred: BASE_CRED, maxCred: BASE_CRED, silver: 0,
      relics: [], items: [], slots: 3, phase: 'trial', trial: tutorialTrial(), reward: null, shop: null, step: 0,
      stats: { trials: 0, evil: 0, mis: 0, flips: 0 }, log: [], tutorial: true,
    };
    return run;
  }
  // 手ほどき中の処刑（ラン外）
  function tutorialExecute(i) {
    const t = run.trial, c = t.cards[i];
    if (c.executed || t.done) return null;
    c.executed = true;
    const out = { card: c, evil: c.align === 'evil', penalty: 0 };
    if (out.evil) { t.evilDown++; if (t.evilDown >= t.k) { t.done = true; out.win = { silver: 0, perfect: t.mis === 0 }; } }
    else { out.penalty = 2; run.cred = Math.max(0, run.cred - 2); t.mis++; }
    return out;
  }
  function endTutorial() {
    meta.tutorialDone = true;
    saveMeta();
    run = null;
    loadRun();
  }

  return {
    get meta() { return meta; }, get run() { return run; },
    loadMeta, saveMeta, loadRun, saveRun, newRun, flip, setMark, execute, useItem, slotCount,
    takeReward, skipReward, buy, rest, nextChapter, abandon, has, relicUnlocked, roleUnlocked, continueExtra, newExtraRun,
    startTutorial, tutorialExecute, endTutorial, emit, listeners, agitatorAlive,
    clearRunOnly() { run = null; store.del(RUN_KEY); },
    resetAll() { store.del(RUN_KEY); store.del(META_KEY); loadMeta(); run = null; },
  };
})();

      ${t.misPlus ? `<p class="ov-sub" style="color:#ef9aa6">この廷では、誤った処刑の信用減少が＋${t.misPlus}される。</p>` : ''}
      ${t.boss ? `<p class="ov-sub" style="color:#ef9aa6">この廷には首魁『${esc(ROLE[t.boss].name)}』が潜む。<br><small style="color:var(--ash)">${esc(ROLE[t.boss].desc)}</small></p>` : ''}
      <button class="btn primary" data-act="close-ov">審問を始める</button>
    </div>`;
    app.insertBefore(ov, toastWrap);
    Audio2.play('flip');
  }

  function cardHTML(c) {
    const ro2 = ROLE[c.claim];
    return `<button class="card" data-act="card" data-i="${c.i}" aria-label="${circ(c.i)}">
      <div class="card-in">
        <div class="face back"><span class="num">${circ(c.i)}</span>${EMBLEM}</div>
        <div class="face front"><span class="num">${circ(c.i)}</span>
          <div class="por">${Portrait.make(c.face)}</div>
          <div class="card-meta"><div class="nm">${esc(c.name)}</div><div class="rl"><i class="glyph ${ro2.open ? ro2.align : ''}">${ro2.glyph}</i>${esc(ro2.name)}</div></div>
        </div>
      </div>
      <div class="ovl"></div>
    </button>`;
  }
  const cardEl = (i) => document.querySelector(`.card[data-i="${i}"]`);

  const MARKS = { white: '白', black: '黒', unr: '惑', q: '？' };

  function verdictHTML(c) {
    const cls = c.align === 'evil' ? 'evil' : c.align === 'med' ? 'med' : 'good';
    const label = c.align === 'evil' ? '虚偽者' : c.align === 'med' ? '惑い者' : '無辜';
    let sub = ROLE[c.role].name;
    if (c.afflict) sub += c.afflict === 'poison' ? '・毒' : '・魅了';
    return `<div class="verdict ${cls}">${label}<small>${esc(sub)}</small></div>`;
  }

  function updateCard(i) {
    const t = T(), c = t.cards[i], el = cardEl(i);
    if (!el) return;
    const ro2 = ROLE[c.claim];
    const showAll = t.done || run().phase === 'gameover';
    el.classList.toggle('flipped', c.flipped || showAll);
    el.classList.toggle('selected', sel === i);
    el.classList.toggle('executed', c.executed);
    el.classList.toggle('open-evil', ro2.open && (ro2.align === 'minion' || ro2.align === 'boss'));
    el.classList.toggle('open-med', ro2.open && ro2.align === 'med');
    el.classList.toggle('reveal-evil', (c.executed || showAll) && c.align === 'evil');
    let h = '';
    if (c.mark) h += `<span class="mk ${c.mark}">${MARKS[c.mark]}</span>`;
    if (c.seal) h += `<span class="seal-top"><span class="mk ${c.seal}" title="${c.seal === 'white' ? '無辜と判明' : '惑い者と判明'}">${c.seal === 'white' ? '白' : '惑'}</span></span>`;
    const chips = [];
    if (c.truthShown && c.flipped) chips.push(statementTruth(t, i) ? '<span class="chip t">真</span>' : '<span class="chip f">偽</span>');
    if (c.holy) chips.push(c.holy === 'good' ? '<span class="chip holy-good">善</span>' : '<span class="chip holy-evil">悪</span>');
    if (c.identity) chips.push(`<span class="chip id">${ROLE[c.identity].glyph}</span>`);
    if (c.afflictShown && c.afflict) chips.push(`<span class="chip aff">${c.afflict === 'poison' ? '毒' : '魅'}</span>`);
    if (c.crow != null) chips.push(`<span class="chip id">鴉${c.crow}</span>`);
    if (chips.length) h += `<div class="chips">${chips.join('')}</div>`;
    if (c.executed || showAll) h += verdictHTML(c);
    el.querySelector('.ovl').innerHTML = h;
  }

  function renderHud(prevCred) {
    const r = run();
    const cr = document.getElementById('cred');
    if (!cr) return;
    cr.innerHTML = candlesHTML(r.cred, r.maxCred, prevCred) + `<span class="cred-n">${r.cred}/${r.maxCred}</span>`;
    cr.setAttribute('aria-label', `信用 ${r.cred} / ${r.maxCred}`);
    document.getElementById('silver').innerHTML = `<i class="coin"></i>${r.silver}`;
  }

  function renderCount() {
    const t = T(), r = run();
    const el = document.getElementById('countbar');
    if (!el) return;
    const flipped = t.cards.filter((c) => c.flipped).length;
    const relics = r.relics.map((id) => `<i class="glyph relic" role="button" tabindex="0" data-act="relic" data-id="${id}" title="${esc(RELIC[id].name)}">${RELIC[id].glyph}</i>`).join('');
    el.innerHTML = `
      <span class="liars">虚偽者 <b>${t.evilDown}/${t.k}</b> 処刑</span>
      ${t.lurk ? `<span class="liars" role="button" tabindex="0" data-act="lurkinfo" style="cursor:pointer">うち潜伏者 <b>${t.lurk}</b></span>` : ''}
      <span class="unr">惑い者 <b>${t.u}</b></span>
      <span>尋問 <b>${flipped}/${t.n}</b></span>
      ${t.boss ? `<span role="button" tabindex="0" data-act="bossinfo" style="cursor:pointer">首魁 <b style="color:#ef9aa6">${esc(ROLE[t.boss].name)}</b></span>` : ''}
      ${t.bossRow != null ? `<span class="hint">牙：首魁は上から${KANJI_NUM[t.bossRow + 1]}番目の横列</span>` : ''}
      ${t.pardon ? '<span class="hint">赦免状が効いている</span>' : ''}
      ${Game.agitatorAlive(t) && t.cards.some((c) => c.role === 'agitator' && c.flipped) ? '<span class="hint" style="color:#ef9aa6">扇動者が群衆を煽っている</span>' : ''}
      ${relics ? `<span class="relic-strip">${relics}</span>` : ''}`;
  }

  function renderItems() {
    const r = run();
    const el = document.getElementById('items');
    if (!el) return;
    const n = Game.slotCount();
    let h = '';
    for (let s = 0; s < n; s++) {
      const id = r.items[s];
      if (id) h += `<button class="slot ${targetSlot === s ? 'on' : ''}" data-act="slot" data-slot="${s}"><i class="glyph item">${ITEM[id].glyph}</i>${esc(ITEM[id].name)}</button>`;
      else h += '<span class="slot empty">空き</span>';
    }
    el.innerHTML = h;
  }

  function stopTyping() {
    if (typer) { clearInterval(typer.id); typer = null; }
  }
  function typeInto(el, text, done) {
    stopTyping();
    const speed = SPEEDS[Game.meta.settings.speed];
    const finish = () => { stopTyping(); el.innerHTML = rich(text); if (done) done(); };
    if (!speed) { finish(); return; }
    const p = plain(text);
    let n = 0;
    el.innerHTML = '<span class="caret"></span>';
    typer = {
      finish,
      id: setInterval(() => {
        n++;
        if (n % 2) Audio2.play('tick');
        el.innerHTML = esc(p.slice(0, n)) + '<span class="caret"></span>';
        if (n >= p.length) finish();
      }, 1000 / speed),
    };
  }

  function renderDetail(typeNew) {
    const t = T(), r = run();
    const el = document.getElementById('detail');
    if (!el) return;
    stopTyping();
    if (targetSlot != null) {
      const it = ITEM[r.items[targetSlot]];
      el.innerHTML = `<div class="dt-empty"><p><i class="glyph item">${it.glyph}</i> <b>${esc(it.name)}</b>を使う相手を盤上から選んでください。</p><p>${esc(it.desc)}</p>
        <div class="dt-actions"><button class="btn small ghost" data-act="cancel-target">やめる</button></div></div>`;
      return;
    }
    if (sel == null) {
      const flipped = t.cards.filter((c) => c.flipped).length;
      el.innerHTML = `<div class="dt-empty">
        ${flipped < t.n ? '<p><b>伏せられた札に触れると、その者を尋問します。</b>回数に制限はありませんが、尋問の順番を数える者もいます。</p>' : '<p><b>全員の証言が出揃いました。</b>矛盾を突き合わせ、虚偽者を処刑してください。</p>'}
        <p>無辜は真実を、虚偽者は嘘を語る。惑い者の言葉は当てにならない。</p>
        <p style="color:var(--ash-dim)">尋問済みの札に触れると、詳細と印・処刑の操作が出ます。</p></div>`;
      return;
    }
    const c = t.cards[sel];
    const ro2 = ROLE[c.claim];
    const alignNote = ro2.open ? `<span class="note">${ALIGN_LABEL[ro2.align]}・正体を隠さない</span>` : '<span class="note">名乗った身分</span>';
    const lines = [];
    if (c.truthShown) lines.push(statementTruth(t, sel) ? '<span class="vl t">この証言は真実</span>' : '<span class="vl f">この証言は偽り</span>');
    if (c.holy) lines.push(c.holy === 'good' ? '<span class="vl g">聖水：善</span>' : '<span class="vl f">聖水：悪</span>');
    if (c.identity) lines.push(`<span class="vl g">蝋燭：真の身分は「${esc(ROLE[c.identity].name)}」</span>`);
    if (c.afflictShown && c.afflict) lines.push(`<span class="vl p">${c.afflict === 'poison' ? '毒に侵されている' : '魅了されている'}</span>`);
    if (c.seal === 'white') lines.push('<span class="vl g">無辜と判明</span>');
    if (c.seal === 'unr') lines.push('<span class="vl p">惑い者と判明</span>');
    if (c.crow != null) lines.push(`<span class="vl">鴉の眼：周囲八方に虚偽者${c.crow}人</span>`);
    if (c.executed) lines.push(`<span class="vl ${c.align === 'evil' ? 'f' : 'g'}">処刑済み：${c.align === 'evil' ? '虚偽者' : c.align === 'med' ? '惑い者' : '無辜'}（${esc(ROLE[c.role].name)}）</span>`);
    const ordIdx = t.order.indexOf(sel);
    el.innerHTML = `
      <div class="dt-head">
        <div class="dt-por">${Portrait.make(c.face)}</div>
        <div><div class="dt-name">${circ(sel)} ${esc(c.name)}</div>
        <div class="dt-role"><i class="glyph ${ro2.open ? ro2.align : ''}">${ro2.glyph}</i>${esc(ro2.name)} ${alignNote}</div></div>
      </div>
      <p class="dt-desc">${esc(ro2.desc)}${ordIdx >= 0 ? `　<span style="color:var(--ash-dim)">（${ordIdx + 1}番目に尋問）</span>` : ''}</p>
      <div class="testimony" data-act="skip-type">${c.stmt ? (typeNew ? '' : rich(c.stmt.text)) : '……'}</div>
      ${lines.length ? `<div class="verdict-line">${lines.join('')}</div>` : ''}
      ${!c.executed && !t.done ? `
      <div class="marks"><span>印</span>
        ${Object.entries(MARKS).map(([k, v]) => `<button class="mbtn ${k} ${c.mark === k ? 'on' : ''}" data-act="mark" data-m="${k}" aria-pressed="${c.mark === k}">${v}</button>`).join('')}
      </div>
      <div class="dt-actions"><button class="btn danger" data-act="exec">処刑する</button></div>` : ''}`;
    if (typeNew && c.stmt) typeInto(el.querySelector('.testimony'), c.stmt.text);
  }

  function renderLog() {
    const t = T();
    const el = document.getElementById('log');
    if (!el) return;
    const rows = t.cards.filter((c) => c.flipped).sort((a, b) => a.i - b.i);
    el.innerHTML = `<h3>証言録<small>番号順・触れると選択</small></h3>` + (rows.length ? `<ol>${rows.map((c) => {
      const ro2 = ROLE[c.claim];
      const ord = t.order.indexOf(c.i) + 1;
      const m = [];
      if (c.seal) m.push(`<span class="mk ${c.seal}">${c.seal === 'white' ? '白' : '惑'}</span>`);
      if (c.mark) m.push(`<span class="mk ${c.mark}">${MARKS[c.mark]}</span>`);
      if (c.truthShown) m.push(statementTruth(t, c.i) ? '<span class="chip t">真</span>' : '<span class="chip f">偽</span>');
      return `<li class="${sel === c.i ? 'on' : ''} ${c.executed ? 'dead' : ''}" data-act="log" data-i="${c.i}">
        <span class="ln">${circ(c.i)}</span>
        <div class="lb"><div class="lr">${esc(c.name)}・<span style="color:${ro2.open ? (ro2.align === 'med' ? 'var(--ghost)' : '#ef9aa6') : 'var(--gold)'}">${esc(ro2.name)}</span><span class="ord">#${ord}</span></div>
        <div class="lt">${c.stmt ? rich(c.stmt.text) : '……'}</div></div>
        <span class="lm">${m.join('')}</span></li>`;
    }).join('')}</ol>` : '<div class="log-empty">まだ誰も尋問していない。</div>');
  }

  function highlightRefs() {
    const t = T();
    document.querySelectorAll('.card.ref').forEach((e) => e.classList.remove('ref'));
    if (sel == null) return;
    const c = t.cards[sel];
    if (!c.stmt || !c.flipped) return;
    (c.stmt.refs || []).forEach((j) => { const e = cardEl(j); if (e) e.classList.add('ref'); });
  }

  function select(i, typeNew) {
    const prev = sel;
    sel = i;
    if (prev != null) updateCard(prev);
    if (i != null) updateCard(i);
    renderDetail(typeNew);
    renderLog();
    highlightRefs();
  }

  function onCard(i) {
    if (busy) return;
    const t = T();
    const c = t.cards[i];
    if (targetSlot != null) return applyItem(targetSlot, i);
    if (t.done || run().phase === 'gameover') { select(sel === i ? null : i); return; }
    if (!c.flipped) {
      Game.flip(i);
      Audio2.play('flip');
      updateCard(i);
      select(i, true);
      renderCount();
      if (c.truthShown) setTimeout(() => toast(`${circ(i)}の証言は<b>${statementTruth(t, i) ? '真実' : '偽り'}</b>だ。（聖遺物）`), 700);
      if (c.afflictShown && c.afflict) setTimeout(() => toast(`白骨の指が震える……${circ(i)}は${c.afflict === 'poison' ? '毒' : '魅了'}を受けている。`), 900);
      tutEvent('flip', i);
      // 狭い縦画面では詳細を見せる
      const d = document.getElementById('detail');
      if (d && window.innerHeight > window.innerWidth) d.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return;
    }
    Audio2.play('select');
    select(sel === i ? null : i);
  }

  function askExecute() {
    const t = T(), c = t.cards[sel];
    if (!c || c.executed) return;
    if (!c.flipped) { toast('尋問していない者は裁けない。', 'bad'); return; }
    const ro2 = ROLE[c.claim];
    confirmBox('処刑の宣告', `${circ(c.i)} ${esc(c.name)}（${esc(ro2.name)}）を処刑しますか。<br><small style="color:var(--ash)">無辜なら信用−${2 + (t.misPlus || 0)}、惑い者なら信用−${1 + (t.misPlus || 0)}${c.claim === 'jester' ? '（道化はさらに重い）' : ''}。</small>`, '処刑する', () => { setTimeout(() => doExecute(c.i), 50); }, true);
  }

  function doExecute(i) {
    const r = run(), t = T();
    busy = true;
    const el = cardEl(i);
    el.classList.add('shake');
    const sl = document.createElement('div'); sl.className = 'slash'; el.appendChild(sl);
    Audio2.play('execute');
    const before = r.cred;
    setTimeout(() => {
      el.classList.remove('shake'); sl.remove();
      const out = t.tutorial ? Game.tutorialExecute(i) : Game.execute(i);
      busy = false;
      if (!out) return;
      const fl = document.createElement('div');
      fl.className = 'flash' + (out.evil ? ' gold' : '');
      app.appendChild(fl); setTimeout(() => fl.remove(), 800);
      updateCard(i);
      renderHud(before);
      renderCount();
      renderDetail();
      renderLog();
      if (out.evil) {
        Audio2.play('good');
        toast(`<b>${esc(t.cards[i].name)}</b>は虚偽者「${esc(ROLE[t.cards[i].role].name)}」だった！${out.silver ? `　銀貨＋${out.silver}` : ''}`, 'good');
      } else {
        Audio2.play('bad');
        const who = t.cards[i].align === 'med' ? '惑い者' : '無辜の者';
        const saved = out.saved === 'pardon' ? '……だが赦免状が信用を守った。' : out.saved === 'kuroneko' ? '……黒猫の骨が災いを払った。' : `信用−${out.penalty}`;
        toast(`<b>${esc(t.cards[i].name)}</b>は${who}だった。${saved}`, 'bad');
      }
      if (out.crow != null) setTimeout(() => toast(`鴉の眼：その者の周囲八方に、虚偽者は${out.crow}人いた。`), 600);
      tutEvent('exec', i, out);
      if (out.gameover) { setTimeout(showGameOver, 1100); return; }
      if (out.win) {
        if (t.tutorial) return;
        setTimeout(() => revealAll(() => showTrialEndOverlay(out)), 700);
      }
    }, 520);
  }

  function revealAll(done) {
    const t = T();
    const hidden = t.cards.filter((c) => !c.flipped);
    hidden.forEach((c, x) => setTimeout(() => { updateCard(c.i); Audio2.play('flip'); }, x * 120));
    t.cards.forEach((c) => setTimeout(() => updateCard(c.i), hidden.length * 120));
    setTimeout(done, hidden.length * 120 + 900);
  }

  function showTrialEndOverlay(out) {
    const r = run(), t = T();
    Audio2.play('victory');
    const w = out.win || {};
    const unlocks = (out.unlocks || []).map((u) => u.kind === 'role'
      ? `<div class="unlock-note">新たな身分『${esc(ROLE[u.id].name)}』が、これからの審判に現れるようになった。</div>`
      : `<div class="unlock-note">新たな聖遺物『${esc(RELIC[u.id].name)}』が見つかるようになった。</div>`).join('');
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="ov-inner">
      <div class="stamp-big">審理終結</div>
      <p class="ov-sub">虚偽者${t.k}人すべてに裁きが下された。</p>
      <div class="ledger">
        ${w.silver != null ? `<div><span>報酬の銀貨</span><span>＋${w.silver}</span></div>` : ''}
        <div><span>誤った処刑</span><span>${t.mis}</span></div>
        ${w.perfect ? '<div><span>完全審理（誤りなし）</span><span>銀貨＋10 込み</span></div>' : ''}
        ${w.healed ? `<div><span>灰の祈祷書</span><span>信用＋${w.healed}</span></div>` : ''}
        <div><span>信用</span><span>${r.cred} / ${r.maxCred}</span></div>
      </div>
      ${unlocks}
      <div class="center-row">
        <button class="btn ghost" data-act="peek">盤面を確かめる</button>
        <button class="btn primary" data-act="to-next">判決を記す</button>
      </div>
    </div>`;
    app.insertBefore(ov, toastWrap);
  }

  function showGameOver() {
    const r = run(), t = T(), m = Game.meta;
    Audio2.play('gameover');
    Audio2.setMood('calm');
    t.cards.forEach((c) => updateCard(c.i));
    const next = ROLES.filter((x) => x.unlock > m.trialsCleared).sort((a, b) => a.unlock - b.unlock)[0];
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="ov-inner">
      <div class="stamp-big bad">解　任</div>
      <p class="ov-sub">信用の灯はすべて消えた。審問官の任を解かれる。</p>
      <div class="ledger">
        <div><span>到達</span><span>${esc(CHAPTERS[r.chapter].no)}　${esc(CHAPTERS[r.chapter].name)}</span></div>
        <div><span>終えた審判</span><span>${r.stats.trials}</span></div>
        <div><span>処刑した虚偽者</span><span>${r.stats.evil}</span></div>
        <div><span>誤った処刑</span><span>${r.stats.mis}</span></div>
        <div><span>階位</span><span>${esc(RANKS[r.rank].name)}</span></div>
      </div>
      ${next ? `<div class="unlock-note">累計審判 ${m.trialsCleared}。あと${next.unlock - m.trialsCleared}審判で、新たな身分が現れる。</div>` : ''}
      <div class="center-row">
        <button class="btn ghost" data-act="peek">盤面を確かめる</button>
        <button class="btn primary" data-act="end-run">タイトルへ</button>
      </div>
    </div>`;
    app.insertBefore(ov, toastWrap);
  }

  function peek() {
    const ov = app.querySelector('.overlay');
    if (!ov) return;
    ov.hidden = true;
    const r = run();
    const bar = document.createElement('div');
    bar.className = 'guide-box';
    bar.style.bottom = 'calc(12px + env(safe-area-inset-bottom, 0px))';
    bar.innerHTML = `<div class="gf" style="margin:0;justify-content:space-between;align-items:center"><span>盤面を確かめています。札に触れると真の身分が見えます。</span><button class="btn small primary" data-act="unpeek">${r.phase === 'gameover' ? '戻る' : '戻る'}</button></div>`;
    app.insertBefore(bar, toastWrap);
  }
  function unpeek() {
    app.querySelectorAll('.guide-box').forEach((n) => n.remove());
    const ov = app.querySelector('.overlay');
    if (ov) ov.hidden = false;
  }

  /* ----- 道具 ----- */
  function onSlot(s) {
    const r = run(), t = T();
    if (t.done || r.phase === 'gameover') return;
    const id = r.items[s];
    if (!id) return;
    const it = ITEM[id];
    Audio2.play('select');
    if (targetSlot === s) { targetSlot = null; renderItems(); renderDetail(); return; }
    if (it.target === 'none') {
      confirmBox(`${it.name}を使う`, esc(it.desc), '使う', () => { setTimeout(() => applyItem(s, null), 0); });
      return;
    }
    targetSlot = s;
    renderItems();
    renderDetail();
  }

  function applyItem(s, target) {
    const t = T();
    const res = Game.useItem(s, target);
    targetSlot = null;
    renderItems();
    if (!res) { renderDetail(); return; }
    if (res.error) { toast(res.error, 'bad'); renderDetail(); return; }
    Audio2.play('item');
    const c = res.card;
    if (res.id === 'holywater') toast(`聖水が${circ(c.i)}に落ちる……<b>${res.result === 'good' ? '善' : '悪'}</b>と出た。`, res.result === 'good' ? '' : 'bad');
    if (res.id === 'scales') toast(`秤が傾く……${circ(c.i)}の証言は<b>${res.result ? '真実' : '偽り'}</b>。`);
    if (res.id === 'candle') toast(`蝋燭が照らす……${circ(c.i)}の真の身分は<b>『${esc(ROLE[res.result].name)}』</b>。`);
    if (res.id === 'pardon') toast('赦免状に署名した。次の誤った処刑は咎められない。');
    if (res.id === 'wine') toast('葡萄酒が喉を潤す。信用＋2。', 'good');
    if (res.id === 'lily') toast(`白百合が${circ(c.i)}の前に置かれた。この者は無辜だ。`, 'good');
    if (c) updateCard(c.i);
    renderHud(); renderCount();
    if (c && c.flipped) select(c.i); else { renderDetail(); renderLog(); }
  }

  /* ========== 報酬 ========== */
  function optionHTML(o, idx, act, priceTag) {
    let glyph, name, desc, kind, cls;
    if (o.type === 'relic') { const x = RELIC[o.id]; glyph = x.glyph; name = x.name; desc = x.desc; kind = 'Relic'; cls = 'relic'; }
    if (o.type === 'item') { const x = ITEM[o.id]; glyph = x.glyph; name = x.name; desc = x.desc; kind = 'Item'; cls = 'item'; }
    if (o.type === 'rest') { glyph = '休'; name = '休息'; desc = `信用を${o.amount}回復する。`; kind = 'Rest'; cls = ''; }
    if (o.type === 'silver') { glyph = '銀'; name = `銀貨 ${o.amount}枚`; desc = '行商人との取引に使える。'; kind = 'Silver'; cls = 'item'; }
    return `<button class="choice ${o.sold ? 'sold' : ''}" data-act="${act}" data-idx="${idx}" ${o.sold ? 'disabled' : ''}>
      <span class="kind">${kind}</span><i class="glyph ${cls}">${glyph}</i><b>${esc(name)}</b><p>${esc(desc)}</p>
      ${priceTag ? `<span class="price"><i class="coin"></i>${o.price}</span>` : ''}</button>`;
  }

  function statusBar() {
    const r = run();
    return `<div class="statusbar">
      <span class="cred">${candlesHTML(r.cred, r.maxCred)}<span class="cred-n">${r.cred}/${r.maxCred}</span></span>
      <span class="silver"><i class="coin"></i>${r.silver}</span>
      <span>道具 ${r.items.length}/${Game.slotCount()}</span>
      ${r.relics.length ? `<span class="relic-strip">${r.relics.map((id) => `<i class="glyph relic" role="button" tabindex="0" data-act="relic" data-id="${id}" title="${esc(RELIC[id].name)}">${RELIC[id].glyph}</i>`).join('')}</span>` : ''}
    </div>`;
  }
  function progressHTML() {
    const r = run();
    let h = '<div class="progress" aria-label="進行">';
    let first = true;
    CHAPTERS.forEach((ch, ci) => {
      if (ch.extra && !r.extended) return;
      if (r.direct && !ch.extra) return;
      if (!first) h += '<span class="sep"></span>';
      first = false;
      ch.trials.forEach((_, ti) => {
        const done = ci < r.chapter || (ci === r.chapter && ti < r.trialIdx) || (ci === r.chapter && ti === r.trialIdx && r.phase !== 'trial');
        const cur = ci === r.chapter && ti === r.trialIdx && r.phase === 'trial';
        h += `<i class="${done ? 'done' : cur ? 'cur' : ''}"></i>`;
      });
    });
    return h + '</div>';
  }

  /* ========== 各種の帳面 ========== */
  function rulesBody() {
    return `<div class="rules">
      <h4>審問官の務め</h4>
      <ul><li>盤上に潜む<b>虚偽者</b>を全員処刑すれば、その審判は終わる。虚偽者と惑い者の人数は常に示される。</li>
      <li>全${MAIN_CHAPTERS - 1}章（各3審判）と最終審判を越えれば勝利。勝利の後には、続きの<b>外典</b>（超むず・激ムズ）がある。</li></ul>
      <h4>尋問</h4>
      <ul><li>伏せ札に触れると尋問し、その者が<b>名乗る身分</b>と<b>証言</b>が明らかになる。</li>
      <li>回数の制限はない。ただし<b>鐘撞き</b>や<b>墓守</b>のように、尋問の順番を数える者もいる。</li></ul>
      <h4>三つの立場</h4>
      <ul><li><b>無辜</b>：必ず真実を語る。</li>
      <li><b>虚偽者</b>（従者・首魁）：必ず嘘をつく。多くは無辜の身分を騙り、その身分の作法で嘘をつく。一部は正体を隠さない。</li>
      <li><b>惑い者</b>：善側だが、証言は当てにならない。生まれつきの惑い者のほか、<b>毒</b>や<b>魅了</b>を受けた無辜も惑い者として数える。</li>
      <li><b>潜伏者</b>：例外の虚偽者。真実しか語らないので、矛盾からは見つからない。いる時は人数が示される。他の者の証言から追い詰めよう。</li></ul>
      <h4>手がかりの掟</h4>
      <ul><li><b>善側（無辜・惑い者）の身分は重複しない。</b>同じ身分を名乗る者が二人いれば、少なくとも一方は虚偽者。</li>
      <li><b>上下左右</b>＝隣り合う4方向。<b>周囲八方</b>＝斜めを含む8方向。<b>歩</b>＝上下左右に進む歩数。</li>
      <li><b>陣営</b>＝虚偽者か、そうでないか。証言の数には、すでに処刑された者も含まれる。</li>
      <li>「もしAが虚偽者なら、Bは虚偽者だ」という証言は、Aが虚偽者でなければ真実として扱われる。</li>
      <li>盤面によっては、論理だけでは二通りに絞るのが限界のこともある。道具や聖遺物で見極めよう。</li></ul>
      <h4>処刑と信用</h4>
      <ul><li>無辜を処刑すると<b>信用−2</b>、惑い者なら<b>−1</b>（道化は−3）。信用が尽きると<b>解任</b>。</li>
      <li>白・黒・惑・？の<b>印</b>で推理を整理できる。印は判定に影響しない。</li></ul>
      <h4>道具と聖遺物</h4>
      <ul><li><b>道具</b>は一度きりの使い捨て。<b>聖遺物</b>はその審問のあいだ効果が続く。</li>
      <li>審判を終えると報酬を一つ選べる。章の終わりには行商人と宿がある。</li></ul>
    </div>`;
  }
  function showRules() { modal({ title: '廷の掟', body: rulesBody() }); }

  function showCodex(tab = 'good') {
    const m = Game.meta;
    if (m.newUnlocks && m.newUnlocks.length) { m.newUnlocks = []; Game.saveMeta(); }
    const tabs = [['good', '無辜'], ['med', '惑い者'], ['minion', '従者'], ['boss', '首魁']];
    const md = modal({ title: '身分図鑑', body: '' });
    const b = md.el.querySelector('.modal-b');
    const tabsEl = document.createElement('div');
    tabsEl.className = 'tabs';
    b.before(tabsEl);
    const draw = (tb) => {
      tabsEl.innerHTML = tabs.map(([k, v]) => `<button class="tab ${k === tb ? 'on' : ''}" data-tab="${k}">${v}</button>`).join('');
      const list = ROLES.filter((r) => r.align === tb);
      b.innerHTML = list.map((r) => {
        const un = Game.roleUnlocked(r);
        if (!un) return `<div class="entry locked"><i class="glyph">？</i><div class="entry-n">？？？</div><div class="entry-d">${r.extraOnly ? '外典に到達すると明らかになる。' : r.complex ? `外典に到達するか、累計${r.unlock}審判を終えると現れる。` : `累計${r.unlock}審判を終えると現れる。`}</div></div>`;
        return `<div class="entry"><i class="glyph ${r.align}">${r.glyph}</i>
          <div class="entry-n">${esc(r.name)}<small>${ALIGN_LABEL[r.align]}${r.open ? '・正体を隠さない' : ''}${r.finalOnly ? '・終章のみ' : ''}${r.extraOnly ? '・外典のみ' : ''}${r.complex ? '・複雑' : ''}</small></div>
          <div class="entry-d">${esc(r.desc)}<em>${esc(r.lore)}</em></div></div>`;
      }).join('');
      b.scrollTop = 0;
    };
    tabsEl.addEventListener('click', (e) => { const x = e.target.closest('[data-tab]'); if (x) { Audio2.play('select'); draw(x.dataset.tab); } });
    draw(tab);
  }

        ${isTut ? '<button class="btn" data-m="endtut">手ほどきを終える</button>' : '<button class="btn" data-m="title">タイトルへ（自動保存）</button><button class="btn danger" data-m="abandon">審問を放棄する</button>'}
      </div>`,
    });
    md.el.addEventListener('click', (e) => {
      const x = e.target.closest('[data-m]');
      if (!x) return;
      Audio2.play('select');
      const k = x.dataset.m;
      md.close();
      if (k === 'rules') showRules();
      if (k === 'codex') showCodex();
      if (k === 'relics') showRelics();
      if (k === 'settings') showSettings();
      if (k === 'title') showTitle();
      if (k === 'endtut') { Game.endTutorial(); showTitle(); }
      if (k === 'abandon') confirmBox('審問の放棄', 'この審問を終わらせます。解禁の進み具合は残ります。', '放棄する', () => { Game.abandon(); setTimeout(showTitle, 0); }, true);
    });
  }

  /* ========== 手ほどき ========== */
  const TUT = [
    { text: '審問官よ、ようこそ。<br>伏せられた六枚の札が、今宵の容疑者たちだ。この中に<b>虚偽者が一人</b>潜んでいる。', wait: 'next' },
    { text: 'まずは<b>①</b>の札に触れて、尋問してみよう。', wait: 'flip', target: [0] },
    { text: '名乗った身分と証言が明らかになった。<b>無辜は必ず真実を語り、虚偽者は必ず嘘をつく。</b><br>残る五人も、すべて尋問しよう。', wait: 'allflip' },
    { text: '<b>③</b>の告発人は「①は虚偽者だ」と言っている。<br>もし本当に①が虚偽者なら、①の証言は嘘のはずだ。', wait: 'next', target: [2, 0] },
    { text: '①は「上下左右（②と④）に虚偽者は0人」と言った。これが嘘なら、②か④にも虚偽者がいることになる。<br>だが虚偽者は一人だけ――<b>矛盾</b>だ。', wait: 'next', target: [0, 1, 3] },
    { text: 'つまり①は無辜。①を偽って告発した<b>③こそが嘘つき</b>だ。<br>③を選び、「処刑する」を押そう。（印をつけて整理することもできる）', wait: 'exec', target: [2] },
  ];
  function tutStart() {
    tut = { step: 0 };
    tutRender();
  }
  function tutRender() {
    app.querySelectorAll('.guide-box').forEach((n) => n.remove());
    document.querySelectorAll('.card.guide').forEach((e) => e.classList.remove('guide'));
    if (!tut) return;
    const s = TUT[tut.step];
    if (!s) return;
    (s.target || []).forEach((i) => { const e = cardEl(i); if (e) e.classList.add('guide'); });
    const box = document.createElement('div');
    box.className = 'guide-box guide-inline';
    box.innerHTML = `<div class="who">The Elder Inquisitor</div><div>${s.text}</div>
      ${s.wait === 'next' ? '<div class="gf"><button class="btn small primary" data-act="tut-next">次へ</button></div>' : ''}`;
    const side = app.querySelector('.side');
    if (side) { side.prepend(box); side.scrollTop = 0; } else app.insertBefore(box, toastWrap);
  }
  function tutEvent(type, i, out) {
    if (!tut) return;
    const s = TUT[tut.step];
    const t = T();
    if (type === 'exec') {
      if (out && out.evil) {
        tut = null;
        app.querySelectorAll('.guide-box').forEach((n) => n.remove());
        document.querySelectorAll('.card.guide').forEach((e) => e.classList.remove('guide'));
        setTimeout(() => revealAll(() => {
          Audio2.play('victory');
          modal({
            title: '見事だ',
            closable: false,
            body: `<p>虚偽者を全員処刑すれば、審判は終わる。</p>
              <p>誤って無辜を処刑すると、上の<b>信用の蝋燭</b>が消える。すべて消えれば解任だ。</p>
              <p>本番では、善側なのに当てにならない<b>惑い者</b>や、正体を隠さぬ悪、毒を撒く首魁も現れる。掟と図鑑はいつでも開ける。</p>`,
            buttons: [{ label: 'タイトルへ', cls: 'ghost', onClick: () => { Game.endTutorial(); setTimeout(showTitle, 0); } },
              { label: '審問を始める', cls: 'primary', onClick: () => { Game.endTutorial(); setTimeout(startNewFlow, 0); } }],
          });
        }), 600);
      } else {
        setTimeout(() => toast('その者は無辜だった……もう一度、証言を見比べよう。', 'bad'), 400);
      }
      return;
    }
    if (type === 'flip' && s && (s.wait === 'flip')) { tut.step++; tutRender(); return; }
    if (type === 'flip' && s && s.wait === 'allflip' && t.cards.every((c) => c.flipped)) { tut.step++; tutRender(); return; }
    if (type === 'flip' && s && s.wait === 'next' && tut.step === 0) { tut.step = 2; tutRender(); }
  }

  function startTutorial() {
    Game.startTutorial();
    showTrial(false);
  }

  /* ========== 操作の受付 ========== */
  function onClick(e) {
    Audio2.init();
    const a = e.target.closest('[data-act]');
    if (!a || !app.contains(a)) return;
    const act = a.dataset.act;
    switch (act) {
      case 'continue': Audio2.play('select'); route(); break;
      case 'new': Audio2.play('select'); startNewFlow(); break;
      case 'tutorial': Audio2.play('select'); startTutorial(); break;
      case 'new-extra': Audio2.play('select'); startExtraFlow(); break;
      case 'go-extra': Audio2.play('select'); Game.continueExtra(); showTrial(false, true); break;
      case 'lurkinfo': toast(`<b>潜伏者</b>：${esc(ROLE.lurker.desc)}`); break;
      case 'codex': case 'codexbtn': Audio2.play('select'); showCodex(); break;
      case 'relics': Audio2.play('select'); showRelics(); break;
      case 'records': Audio2.play('select'); showRecords(); break;
      case 'settings': Audio2.play('select'); showSettings(); break;
      case 'rules': Audio2.play('select'); showRules(); break;
      case 'menu': Audio2.play('select'); showMenu(); break;
      case 'card': onCard(+a.dataset.i); break;
      case 'log': Audio2.play('select'); select(+a.dataset.i); { const ce = cardEl(+a.dataset.i); if (ce && window.innerHeight > window.innerWidth) ce.scrollIntoView({ block: 'nearest' }); } break;
      case 'ref': {
        e.stopPropagation();
        const j = +a.dataset.ref;
        const ce = cardEl(j);
        if (ce) { ce.classList.add('guide'); setTimeout(() => ce.classList.remove('guide'), 900); }
        Audio2.play('select');
        if (T().cards[j].flipped) select(j);
        break;
      }
      case 'skip-type': if (typer) typer.finish(); break;
      case 'mark': Audio2.play('mark'); Game.setMark(sel, a.dataset.m); updateCard(sel); renderDetail(); renderLog(); break;
      case 'exec': Audio2.play('select'); askExecute(); break;
      case 'slot': onSlot(+a.dataset.slot); break;
      case 'cancel-target': Audio2.play('select'); targetSlot = null; renderItems(); renderDetail(); break;
      case 'relic': { const x = RELIC[a.dataset.id]; toast(`<b>${esc(x.name)}</b>：${esc(x.desc)}`); break; }
      case 'bossinfo': { const x = ROLE[T().boss]; toast(`<b>${esc(x.name)}</b>：${esc(x.desc)}`); break; }
      case 'close-ov': Audio2.play('select'); a.closest('.overlay').remove(); break;
      case 'peek': Audio2.play('select'); peek(); break;
      case 'unpeek': Audio2.play('select'); unpeek(); break;
      case 'to-next': Audio2.play('select'); route(); break;
      case 'end-run': Audio2.play('select'); Game.clearRunOnly(); showTitle(); break;
      case 'take': {
        const res = Game.takeReward(+a.dataset.idx);
        if (res && res.error) { toast(res.error, 'bad'); break; }
        Audio2.play('coin');
        route();
        break;
      }
      case 'skip-reward': Audio2.play('select'); Game.skipReward(); route(); break;
      case 'buy': {
        const res = Game.buy(+a.dataset.idx);
        if (res && res.error) { toast(res.error, 'bad'); break; }
        Audio2.play('coin');
        showInterlude();
        break;
      }
      case 'rest': { const res = Game.rest(); if (res) { Audio2.play('good'); toast(`宿で体を休めた。信用＋${res.amount}。`, 'good'); showInterlude(); } break; }
      case 'next-chapter': Audio2.play('select'); Game.nextChapter(); showTrial(false, true); break;
      case 'tut-next': Audio2.play('select'); tut.step++; tutRender(); break;
      default: break;
    }
  }

  function onKey(e) {
    if (e.key === 'Escape') {
      const m = app.querySelector('.modal-bg:last-of-type');
      if (m) { const x = m.querySelector('[data-x]'); if (x) x.click(); }
    }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')) { e.preventDefault(); e.target.click(); }
  }

  /* ---------- 舞う埃 ---------- */
  function dust() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = document.createElement('canvas');
    cv.id = 'dust';
    app.prepend(cv);
    const ctx = cv.getContext('2d');
    let W = 0, H = 0;
    const ps = range(36).map(() => ({ x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 1.4, v: 0.00008 + Math.random() * 0.00025, d: Math.random() * 6.28 }));
    const resize = () => { const dpr = Math.min(2, window.devicePixelRatio || 1); W = cv.width = app.clientWidth * dpr; H = cv.height = app.clientHeight * dpr; cv.style.width = '100%'; cv.style.height = '100%'; };
    resize();
    window.addEventListener('resize', resize);
    let last = performance.now();
    const loop = (now) => {
      const dt = Math.min(50, now - last); last = now;
      ctx.clearRect(0, 0, W, H);
      for (const p of ps) {
        p.y -= p.v * dt; p.d += 0.0006 * dt;
        p.x += Math.sin(p.d) * 0.00005 * dt;
        if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
        ctx.fillStyle = `rgba(232,201,135,${0.18 + 0.2 * Math.sin(p.d * 2) ** 2})`;
        ctx.beginPath(); ctx.arc(p.x * W, p.y * H, p.s * (W / app.clientWidth), 0, 6.283); ctx.fill();
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }

  function boot() {
    Game.loadMeta();
    Game.loadRun();
    toastWrap = document.createElement('div');
    toastWrap.className = 'toast-wrap';
    toastWrap.setAttribute('aria-live', 'polite');
    app.appendChild(toastWrap);
    dust();
    Audio2.setBgm(Game.meta.settings.bgm);
    Audio2.setSfx(Game.meta.settings.sfx);
    app.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
    showTitle();
  }

  return { boot, toast };
})();

/* ---- main.js ---- */
/* ===== 起動 ===== */
UI.boot();

})();
</script>
</body>
